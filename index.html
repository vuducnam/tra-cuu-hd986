<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tra cứu HD986 — HVCTQGHCM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --red: #B01228;
      --red-soft: #f3dfe2;
      --ink: #1c1a17;
      --ink-2: #55504a;
      --paper: #faf6ef;
      --card: #ffffff;
      --line: #e7e0d4;
      --gold: #9a7b2e;
      --shadow: 0 1px 2px rgba(28, 26, 23, .06), 0 8px 24px -12px rgba(28, 26, 23, .18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      font-family: "Be Vietnam Pro", "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
      font-size: 16px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 14px 64px
    }

    /* ===== Header ===== */
    header.top {
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(180deg, var(--paper) 70%, rgba(250, 246, 239, .0));
      padding-top: env(safe-area-inset-top);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 14px 10px;
      max-width: 760px;
      margin: 0 auto
    }

    .brand .star {
      width: 34px;
      height: 34px;
      flex: none;
      border-radius: 8px;
      background: var(--red);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: var(--shadow)
    }

    .brand h1 {
      font-family: "Be Vietnam Pro", sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      letter-spacing: .2px
    }

    .brand p {
      margin: 0;
      font-size: 11.5px;
      color: var(--ink-2);
      font-weight: 500
    }

    .searchbox {
      padding: 0 14px 8px;
      max-width: 760px;
      margin: 0 auto
    }

    .searchbox .field {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 13px;
      padding: 11px 13px;
      box-shadow: var(--shadow)
    }

    .searchbox input {
      border: 0;
      outline: 0;
      width: 100%;
      font: inherit;
      font-size: 16px;
      background: transparent;
      color: var(--ink)
    }

    .searchbox svg {
      flex: none;
      color: var(--ink-2)
    }

    .clearbtn {
      border: 0;
      background: var(--line);
      color: var(--ink-2);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      flex: none;
      display: none
    }

    .clearbtn.show {
      display: block
    }

    /* ===== Tabs ===== */
    .tabs {
      display: flex;
      gap: 6px;
      padding: 4px 14px 10px;
      max-width: 760px;
      margin: 0 auto;
      overflow-x: auto;
      scrollbar-width: none
    }

    .tabs::-webkit-scrollbar {
      display: none
    }

    .tab {
      flex: none;
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--ink-2);
      padding: 8px 14px;
      border-radius: 20px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: .15s
    }

    .tab.active {
      background: var(--red);
      color: #fff;
      border-color: var(--red)
    }

    /* ===== Content ===== */
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 4px 0 14px
    }

    .chip {
      font-size: 11.5px;
      font-weight: 600;
      background: var(--red-soft);
      color: var(--red);
      padding: 4px 10px;
      border-radius: 999px
    }

    .chip.gray {
      background: #eee9df;
      color: var(--ink-2)
    }

    .grouphead {
      font-family: "Be Vietnam Pro", sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 22px 2px 9px
    }

    .grouphead:first-of-type {
      margin-top: 6px
    }

    .card {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      margin-bottom: 9px;
      overflow: hidden;
      box-shadow: var(--shadow)
    }

    .card>button.head {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
      padding: 13px 15px;
      display: flex;
      gap: 11px;
      align-items: flex-start;
      font: inherit
    }

    .num {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--red);
      flex: none;
      min-width: 20px;
      line-height: 1.45
    }

    .htext {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .htext .t {
      font-weight: 600;
      font-size: 15px;
      color: var(--ink);
      line-height: 1.35
    }

    .htext .s {
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.4
    }

    .chev {
      flex: none;
      color: var(--ink-2);
      transition: transform .2s;
      margin-top: 3px
    }

    .card.open .chev {
      transform: rotate(180deg)
    }

    .body {
      display: none;
      padding: 0 15px 15px;
      animation: fade .2s ease
    }

    .card.open .body {
      display: block
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(-3px)
      }

      to {
        opacity: 1
      }
    }

    .body p {
      margin: 0 0 8px
    }

    .body ul {
      margin: 2px 0 10px;
      padding-left: 18px
    }

    .body li {
      margin-bottom: 5px;
      font-size: 14.5px
    }

    .body .pin {
      background: var(--red-soft);
      color: var(--red);
      font-weight: 600;
      font-size: 13px;
      padding: 7px 11px;
      border-radius: 9px;
      margin: 2px 0 10px;
      display: block
    }

    .body b {
      color: var(--ink)
    }

    .kbd {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 600;
      background: #f0ebe0;
      border: 1px solid var(--line);
      padding: 1px 7px;
      border-radius: 6px;
      font-size: 13.5px;
      color: var(--ink);
      white-space: nowrap
    }

    /* ===== Tables ===== */
    .tblwrap {
      overflow-x: auto;
      margin: 2px 0 6px
    }

    .tbl {
      width: 100%;
      border-collapse: collapse;
      margin: 2px 0 6px;
      font-size: 13.5px
    }

    .tbl th,
    .tbl td {
      border: 1px solid var(--line);
      padding: 7px 9px;
      text-align: left;
      vertical-align: top
    }

    .tbl th {
      background: #f3eee3;
      font-weight: 600;
      font-size: 12.5px;
      color: var(--ink-2)
    }

    .tbl td .kbd {
      font-size: 13px
    }

    .tbl tr:nth-child(even) td {
      background: #fcfaf5
    }

    /* ===== Sơ đồ A4 (Phụ lục 1) ===== */
    .a4 {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 8px auto 4px;
      aspect-ratio: 210/297;
      background: #fff;
      border: 1.5px solid var(--ink);
    }

    .a4 .in {
      position: absolute;
      top: 6.7%;
      bottom: 6.7%;
      left: 14.3%;
      right: 7.1%;
      border: 1px dashed #c9c0b0;
    }

    .a4 .bx {
      position: absolute;
      border: 1.2px solid var(--ink);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1;
    }

    .a4 .bx.rd {
      border-radius: 50%;
      z-index: 2;
      background: #fff;
    }

    .a4 .kline {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1.2px solid var(--ink);
    }

    .a4 .mlbl {
      position: absolute;
      font-size: 8.5px;
      color: var(--ink-2);
      font-weight: 600;
      white-space: nowrap;
    }

    .a4note {
      font-size: 11px;
      color: var(--ink-2);
      text-align: center;
      margin: 0 0 10px
    }

    .empty {
      text-align: center;
      color: var(--ink-2);
      padding: 48px 20px;
      font-size: 14.5px
    }

    .empty b {
      display: block;
      color: var(--ink);
      font-size: 16px;
      margin-bottom: 4px
    }

    mark {
      background: #ffe9a8;
      color: inherit;
      padding: 0 1px;
      border-radius: 3px
    }

    .footer {
      text-align: center;
      font-size: 11.5px;
      color: var(--ink-2);
      margin-top: 26px;
      line-height: 1.6
    }
  </style>
</head>

<body>

  <header class="top">
    <div class="brand">
      <div class="star">★</div>
      <div>
        <h1>Tra cứu HD986</h1>
        <p>Thể thức và kỹ thuật trình bày văn bản — HVCTQGHCM · hiện hành, thay thế HD488</p>
      </div>
    </div>
    <div class="searchbox">
      <div class="field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input id="q" type="search" inputmode="search" placeholder="Tìm: ký hiệu, định lề, cỡ chữ, nơi nhận…"
          autocomplete="off">
        <button class="clearbtn" id="clear" aria-label="Xóa">×</button>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="thethuc">Thể thức bắt buộc</button>
      <button class="tab" data-tab="bosung">Bổ sung</button>
      <button class="tab" data-tab="bansao">Bản sao</button>
      <button class="tab" data-tab="kythuat">Kỹ thuật trình bày</button>
      <button class="tab" data-tab="phuluc">Phụ lục</button>
    </div>
  </header>

  <main class="wrap" id="main"></main>

  <script>
    /* ---------- DỮ LIỆU ---------- */
    const META = ['Số 986-HD/HVCTQGHCM', 'Ban hành 14/7/2026 · hiệu lực từ ngày ký', 'Thay thế HD 488-HD/HVCTQG (18/10/2018)'];
    const DATA = {
      thethuc: {
        meta: META,
        groups: [
          {
            name: 'Phần I · Hướng dẫn chung', items: [
              {
                t: 'Phạm vi điều chỉnh và đối tượng áp dụng', s: 'Văn bản giấy + điện tử · toàn hệ thống Học viện',
                body: `<ul><li>Điều chỉnh: thể thức và kỹ thuật trình bày <b>văn bản giấy và văn bản điện tử</b> của Học viện và các đơn vị trực thuộc.</li>
        <li>Văn bản chứa bí mật nhà nước: theo Hướng dẫn này và pháp luật về bảo vệ bí mật nhà nước.</li>
        <li><b>Không thuộc phạm vi:</b> văn bản chuyên ngành, văn bản in thành sách và các ấn phẩm khác.</li>
        <li>Áp dụng trong <b>toàn hệ thống</b> Học viện Chính trị quốc gia Hồ Chí Minh.</li></ul>`,
                k: 'pham vi dieu chinh doi tuong ap dung van ban giay dien tu bi mat nha nuoc chuyen nganh an pham'
              },
              {
                t: 'Yêu cầu', s: 'Thống nhất thể thức và kỹ thuật trình bày',
                body: `<p>Văn bản chính thức của Học viện và các đơn vị trực thuộc Học viện phải <b>thống nhất về thể thức và kỹ thuật trình bày</b>.</p>`,
                k: 'yeu cau thong nhat the thuc ky thuat trinh bay'
              },
              {
                t: 'Trách nhiệm của cá nhân', s: 'Người ký · Chánh Văn phòng · người soạn thảo · văn thư',
                body: `<ul><li><b>Người ký văn bản</b>: chịu trách nhiệm về thể thức và kỹ thuật trình bày.</li>
        <li><b>Chánh Văn phòng</b> (hoặc người được giao phụ trách công tác văn phòng): thẩm định thể thức và kỹ thuật trình bày.</li>
        <li><b>Người soạn thảo</b>: thực hiện đúng hướng dẫn.</li>
        <li><b>Văn thư cơ quan</b>: kiểm tra thể thức và kỹ thuật trình bày trước khi trình ký, phát hành.</li></ul>`,
                k: 'trach nhiem ca nhan nguoi ky chanh van phong nguoi soan thao van thu tham dinh kiem tra trinh ky phat hanh'
              },
            ]
          },
          {
            name: '9 thành phần thể thức bắt buộc', items: [
              {
                n: '1', t: 'Tiêu đề "Đảng Cộng sản Việt Nam"', s: 'Góc phải, dòng đầu · in hoa 15 đứng đậm',
                body: `<ul><li>Là thành phần thể thức <b>xác định văn bản của Đảng</b>.</li>
        <li>Trang đầu, <b>góc phải, dòng đầu</b>; phía dưới có <b>đường kẻ ngang nét liền</b> dài bằng độ dài tiêu đề, ngăn cách với địa danh và ngày, tháng, năm (ô số 1, Phụ lục 1).</li>
        <li>Trình bày: in hoa, chữ đứng, đậm, cỡ chữ <b>15</b>.</li></ul>
        <p><b>Ví dụ:</b> ĐẢNG CỘNG SẢN VIỆT NAM</p>`,
                k: 'tieu de dang cong san viet nam goc phai dong dau duong ke ngang net lien in hoa 15 dung dam'
              },
              {
                n: '2', t: 'Tên cơ quan ban hành văn bản', s: 'Góc trái, ngang tiêu đề · dưới có dấu sao (*)',
                body: `<ul><li>Xác định <b>tác giả văn bản</b>; ghi chính xác, đầy đủ theo văn bản thành lập. Gồm <b>cơ quan cấp trên trực tiếp</b> và <b>cơ quan ban hành</b>.</li>
        <li><b>Góc trái, dòng đầu</b>, ngang với tiêu đề; phía dưới có <b>dấu sao (*)</b> ngăn cách với số và ký hiệu (ô số 2, Phụ lục 1).</li>
        <li>Cân đối dưới tên cơ quan cấp trên trực tiếp (nếu có); tên dài có thể nhiều dòng.</li>
        <li>Liên cơ quan: cơ quan <b>chủ trì ghi trước</b>, giữa các tên có dấu gạch nối (-).</li>
        <li>Cấp trên trực tiếp: in hoa, đứng, cỡ <b>14</b>. Cơ quan ban hành: in hoa, đứng, <b>đậm</b>, cỡ <b>14</b>.</li></ul>
        <p><b>Ví dụ:</b> BAN CHẤP HÀNH TRUNG ƯƠNG / <b>HỌC VIỆN CHÍNH TRỊ QUỐC GIA HỒ CHÍ MINH</b>; VĂN PHÒNG HỌC VIỆN / <b>PHÒNG HÀNH CHÍNH – TỔNG HỢP</b>; liên cơ quan: <b>VĂN PHÒNG HỌC VIỆN – VỤ TỔ CHỨC CÁN BỘ</b></p>`,
                k: 'ten co quan ban hanh goc trai dau sao cap tren truc tiep lien co quan gach noi in hoa 14 dam van phong hoc vien ban chi dao'
              },
              {
                n: '3', t: 'Số và ký hiệu văn bản', s: 'Từ 01 theo năm dương lịch · số nhỏ hơn 10 thêm 0',
                body: `<span class="pin">Số ghi liên tục từ 01 cho mỗi tên loại theo NĂM DƯƠNG LỊCH (01/01 → 31/12)</span>
        <ul><li>Số văn bản mật ghi liên tục với số không mật cùng tên loại. Liên cơ quan: ghi liên tục với số cùng tên loại của cơ quan chủ trì.</li>
        <li>Ký hiệu = viết tắt tên loại + viết tắt cơ quan ban hành: NQ (nghị quyết), CT (chỉ thị), KL (kết luận), QC (quy chế), BC (báo cáo)…</li>
        <li>Trùng chữ cái đầu thì thống nhất: <span class="kbd">QĐ</span> Quyết định, Quy định · <span class="kbd">CTr</span> Chương trình · <span class="kbd">TTr</span> Tờ trình.</li>
        <li>Cân đối dưới tên cơ quan ban hành; in thường, đứng, cỡ <b>14</b> (ô số 3, Phụ lục 1).</li>
        <li>Số nhỏ hơn 10 <b>thêm số 0</b> phía trước; giữa số và ký hiệu là gạch nối (-); giữa tên loại và cơ quan là gạch chéo (/); giữa các liên cơ quan là gạch nối (-).</li>
        <li>Ký hiệu tên đơn vị: xem Phụ lục 3.</li></ul>
        <p><b>Ví dụ:</b> Số 23-QĐ/HVCTQGHCM · Số 06-CV/VPHV · Số 05-QC/HVCTQGHCM-UBKTTW</p>`,
                k: 'so ky hieu van ban nam duong lich 01 them so 0 gach noi gach cheo mat lien co quan qd ctr ttr nq ct kl qc bc'
              },
              {
                n: '4', t: 'Địa danh và ngày, tháng, năm', s: 'In thường 14 nghiêng · ngày dưới 10, tháng dưới 3 thêm 0',
                body: `<ul><li>Địa danh = tên chính thức đơn vị hành chính (tỉnh, thành phố trực thuộc Trung ương) nơi đặt trụ sở. Liên cơ quan: theo cơ quan chủ trì.</li>
        <li>Địa danh mang tên người hoặc một âm tiết: <b>thêm cấp hành chính</b> phía trước (ví dụ: Thành phố Huế); cấp hành chính có thể viết tắt (TP).</li>
        <li>Ngày, tháng, năm = ngày người có thẩm quyền <b>ký</b> văn bản.</li>
        <li>Cân đối dưới tiêu đề (ô số 4, Phụ lục 1). Ngày dưới 10 và tháng dưới 3 <b>thêm số 0</b>; viết đầy đủ chữ ngày, tháng, năm; giữa địa danh và ngày tháng có dấu phẩy (,).</li>
        <li>Trình bày: in thường, <b>nghiêng</b>, cỡ <b>14</b>.</li></ul>
        <p><b>Ví dụ:</b> <i>Hà Nội, ngày 03 tháng 02 năm 2026</i></p>`,
                k: 'dia danh ngay thang nam ban hanh them so 0 dau phay nghieng 14 thanh pho hue tp mot am tiet'
              },
              {
                n: '5', t: 'Tên loại và trích yếu nội dung', s: 'Chính giữa · dưới có 05 dấu gạch nối · công văn không ghi tên loại',
                body: `<ul><li>Mọi văn bản đều ghi tên loại, <b>trừ công văn</b>. Trích yếu là cụm từ ngắn gọn phản ánh nội dung chủ yếu; một số văn bản có thể ghi tác giả vào trích yếu.</li>
        <li><b>Không lồng ghép</b> loại văn bản này trong loại văn bản khác (ví dụ: Quyết định ban hành quy chế…; Thông báo ban hành kế hoạch…).</li>

        <li>Trích yếu của <b>công văn</b>: cân đối dưới số và ký hiệu (ô số 5b, Phụ lục 1).</li>

            name: 'Phụ lục 4 · Mẫu văn bản thông dụng', items: [
              {
                t: 'Danh mục 10 mẫu văn bản', s: 'CV · TTr · TB · GM · QĐ · QC · KH · BC',
                body: `<div class="tblwrap"><table class="tbl"><tr><th>Mẫu</th><th>Loại văn bản</th><th>Ký hiệu</th></tr>
        <tr><td>Mẫu 1</td><td>Công văn</td><td><span class="kbd">CV</span></td></tr>
        <tr><td>Mẫu 2</td><td>Tờ trình</td><td><span class="kbd">TTr</span></td></tr>
        <tr><td>Mẫu 3</td><td>Thông báo</td><td><span class="kbd">TB</span></td></tr>
        <tr><td>Mẫu 4</td><td>Giấy mời</td><td><span class="kbd">GM</span></td></tr>
        <tr><td>Mẫu 5</td><td>Quyết định</td><td><span class="kbd">QĐ</span></td></tr>
        <tr><td>Mẫu 5.1</td><td>Văn bản kèm theo Quyết định</td><td>—</td></tr>
        <tr><td>Mẫu 6</td><td>Quy chế</td><td><span class="kbd">QC</span></td></tr>
        <tr><td>Mẫu 7</td><td>Quy định</td><td><span class="kbd">QĐ</span></td></tr>
        <tr><td>Mẫu 8</td><td>Kế hoạch</td><td><span class="kbd">KH</span></td></tr>
        <tr><td>Mẫu 9</td><td>Báo cáo</td><td><span class="kbd">BC</span></td></tr></table></div>
        <p>Ghi chú các mẫu thống nhất quy cách tại Phụ lục 2. Điểm riêng:</p>
        <ul><li><b>Giấy mời</b>: cuối trang có dòng "Thông tin chi tiết xin liên hệ: Đồng chí…, …(chức vụ)…, Số điện thoại:…" — in thường, đứng, cỡ 10.</li>
        <li><b>Báo cáo</b>: có thể kèm chỉ dẫn phạm vi lưu hành "TÀI LIỆU HỘI NGHỊ" — in hoa, đứng, đậm, cỡ 12.</li>
        <li><b>Văn bản kèm theo Quyết định</b>: tiêu đề tóm tắt nội dung + dòng "(Ban hành kèm theo Quyết định số …-QĐ/HVCTQGHCM ngày … của Giám đốc Học viện)" + 05 dấu gạch nối.</li>
        <li><b>Quyết định</b>: phần căn cứ kết bằng "Xét đề nghị của…," rồi đến "GIÁM ĐỐC HỌC VIỆN QUYẾT ĐỊNH" và các Điều.</li></ul>`,
                k: 'phu luc 4 mau van ban cong van to trinh thong bao giay moi quyet dinh quy che quy dinh ke hoach bao cao cv ttr tb gm qd qc kh bc'
              },
            ]
          },
        ]
      },
    };

    /* ---------- RENDER ---------- */
    const main = document.getElementById('main');
    const tabsEl = document.getElementById('tabs');
    const qEl = document.getElementById('q');
    const clearEl = document.getElementById('clear');
    let current = 'thethuc', query = '';

    function norm(s) {
      return (s || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
    }

    function hl(text, q) {
      if (!q) return text;
      const nq = norm(q), nt = norm(text);
      const i = nt.indexOf(nq);
      if (i < 0) return text;
      return text.slice(0, i) + '<mark>' + text.slice(i, i + q.length) + '</mark>' + text.slice(i + q.length);
    }

    function render() {
      const d = DATA[current];
      const nq = norm(query.trim());
      let html = '';
      html += '<div class="meta">' + d.meta.map((m, i) => '<span class="chip' + (i ? ' gray' : '') + '">' + m + '</span>').join('') + '</div>';
      let shown = 0;
      d.groups.forEach(g => {
        const matched = g.items.filter(it => {
          if (!nq) return true;
          return norm(it.t + ' ' + it.s + ' ' + (it.k || '') + ' ' + it.body).includes(nq);
        });
        if (!matched.length) return;
        html += '<div class="grouphead">' + g.name + '</div>';
        matched.forEach(it => {
          shown++;
          const open = nq ? ' open' : '';
          html += '<div class="card' + open + '">'
            + '<button class="head" type="button">'
            + (it.n ? '<span class="num">' + it.n + '</span>' : '')
            + '<span class="htext"><span class="t">' + hl(it.t, query.trim()) + '</span>'
            + '<span class="s">' + hl(it.s, query.trim()) + '</span></span>'
            + '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>'
            + '</button>'
            + '<div class="body">' + it.body + '</div>'
            + '</div>';
        });
      });
      if (!shown) {
        html += '<div class="empty"><b>Không tìm thấy</b>Thử từ khoá khác, ví dụ: <i>định lề, ký hiệu, cỡ chữ, nơi nhận</i>.</div>';
      }
      main.innerHTML = html;
      main.querySelectorAll('.card').forEach(c => {
        c.querySelector('.head').addEventListener('click', () => c.classList.toggle('open'));
      });
    }

    tabsEl.addEventListener('click', e => {
      const b = e.target.closest('.tab'); if (!b) return;
      current = b.dataset.tab;
      tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === b));
      window.scrollTo({ top: 0 });
      render();
    });
    qEl.addEventListener('input', () => {
      query = qEl.value;
      clearEl.classList.toggle('show', !!query);
      render();
    });
    clearEl.addEventListener('click', () => { query = ''; qEl.value = ''; clearEl.classList.remove('show'); qEl.focus(); render(); });

    render();
  </script>
